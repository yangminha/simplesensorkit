<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arduino Sensor Monitor + Graphics</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #fff;
      color: #000;
      font-family: system-ui, sans-serif;
    }

    .monitor {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 36px 24px 42px;
    }

    h1 {
      margin: 0 0 22px;
      font-size: clamp(24px, 4vw, 38px);
    }

    #connect {
      padding: 10px 18px;
      border: 2px solid #000;
      border-radius: 0;
      background: #fff;
      color: #000;
      font: 700 14px system-ui, sans-serif;
      cursor: pointer;
    }

    #connect:disabled {
      background: #000;
      color: #fff;
      cursor: default;
    }

    #status {
      margin-left: 12px;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 24px;
    }

    .card {
      min-height: 104px;
      padding: 16px;
      border: 1px solid #000;
      background: #fff;
    }

    .label {
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    .value {
      margin-top: 8px;
      font-size: 25px;
      font-weight: 750;
    }

    .graphic-section {
      width: 100%;
      border-top: 2px solid #000;
    }

    .graphic-title {
      margin: 0;
      padding: 20px 24px 0;
      text-align: center;
      font-size: 13px;
      letter-spacing: 0.12em;
    }

    #visualization {
      width: 100%;
      height: 600px;
    }

    canvas { display: block; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.1/lib/p5.min.js"></script>
</head>
<body>
  <section class="monitor">
    <h1>Arduino Sensor Data</h1>
    <button id="connect">CONNECT</button>
    <span id="status">Not Connected</span>

    <div class="grid">
      <div class="card"><div class="label">BUTTON 1</div><div class="value" id="button1">OFF</div></div>
      <div class="card"><div class="label">BUTTON 2</div><div class="value" id="button2">OFF</div></div>
      <div class="card"><div class="label">POTENTIOMETER 1</div><div class="value" id="analog1">512</div></div>
      <div class="card"><div class="label">POTENTIOMETER 2</div><div class="value" id="analog2">512</div></div>
      <div class="card"><div class="label">POTENTIOMETER 3</div><div class="value" id="analog3">512</div></div>
      <div class="card"><div class="label">DISTANCE SENSOR</div><div class="value" id="vlActive">INACTIVE</div></div>
      <div class="card"><div class="label">DISTANCE</div><div class="value" id="distanceMm">N/A</div></div>
      <div class="card"><div class="label">TILT X</div><div class="value" id="tiltX">0</div></div>
      <div class="card"><div class="label">TILT Y</div><div class="value" id="tiltY">0</div></div>
    </div>
  </section>

  <section class="graphic-section">
    <h2 class="graphic-title">SENSOR GRAPHICS</h2>
    <div id="visualization"></div>
  </section>

<script>
  const connectButton = document.querySelector('#connect');
  const statusText = document.querySelector('#status');
  let port;
  let keepReading = false;

  let sensorData = {
    button1: false,
    button2: false,
    analog1: '512',
    analog2: '512',
    analog3: '512',
    vlActive: false,
    distanceMm: '0',
    tiltX: '0',
    tiltY: '0'
  };

  function setup() {
    const canvas = createCanvas(windowWidth, windowHeight);
    canvas.parent('visualization');
    pixelDensity(1);
    rectMode(CENTER);
  }

  function draw() {
    const a1 = constrain(numberValue(sensorData.analog1, 512), 0, 1023);
    const a2 = constrain(numberValue(sensorData.analog2, 512), 0, 1023);
    const a3 = constrain(numberValue(sensorData.analog3, 512), 0, 1023);
    const tiltX = constrain(numberValue(sensorData.tiltY, 0), -20000, 20000);
    const tiltY = constrain(numberValue(sensorData.tiltX, 0), -20000, 20000);
    const distance = constrain(numberValue(sensorData.distanceMm, 0), 0, 1200);
    const potSizes = [a1, a2, a3].map(value => map(value, 0, 1023, 0, 255));
    const distanceWidth = sensorData.vlActive ? map(distance, 0, 1200, 0, 500) : 0;
    const tiltXPos = map((tiltX), -20000, 20000, -150, 150);
    const tiltYPos = map((tiltY), -20000, 20000, -150, 150);

    background(255);
    noStroke();
    textFont('system-ui');
    textAlign(CENTER, CENTER);

    // Keep the complete interface centered and shrink it only on small screens.
    const interfaceWidth = 1080;
    const interfaceHeight = 520;
    const interfaceScale = min(1, (width - 32) / interfaceWidth, (height - 32) / interfaceHeight);

    push();
    translate(width / 2, height/5);
    scale(interfaceScale);
    translate(0, -interfaceHeight / 2);

    const firstRowY = 138;
    const firstRowLabelY = 288;
    const firstRowX = [-450, -240, 0, 240, 450];


    fill(sensorData.button1 ? color(255, 0, 0) : color(0));
    circle(firstRowX[0], firstRowY, 72);
    drawGraphicLabel(`BUTTON 1  ·  ${sensorData.button1 ? 'ON' : 'OFF'}`, firstRowX[0], firstRowLabelY);

    fill(0);
    for (let i = 0; i < 3; i++) {
      circle(firstRowX[i + 1], firstRowY, potSizes[i]);
      drawGraphicLabel(`POT ${i + 1}  ·  ${round([a1, a2, a3][i])}`, firstRowX[i + 1], firstRowLabelY);
    }

    fill(sensorData.button2 ? color(0, 255, 255) : color(0));
    circle(firstRowX[4], firstRowY, 72);
    drawGraphicLabel(`BUTTON 2  ·  ${sensorData.button2 ? 'ON' : 'OFF'}`, firstRowX[4], firstRowLabelY);

    
    // Second row: distance changes the width of one centered rectangle.
    const distanceY = 480;
    fill(0);
    rectMode(CORNER);
    stroke(0);
    fill(255);
    rect(-500, distanceY, 500, 40);
    fill(0);
    rect(-500, distanceY, distanceWidth, 40);
    const distanceText = sensorData.vlActive ? `${round(distance)} mm` : 'N/A';
    drawGraphicLabel(`DISTANCE : ${distanceText}`, -450, distanceY + 62);

    rectMode(CENTER);
    // Third row: tilt X and Y change the lengths of two rectangles.
    const tiltYRow = 500;
    stroke(0);
    fill(255);
    rect(220, tiltYRow, 300, 40);
    rect(450, tiltYRow, 40, 300);
    fill(0);
    rect(220+tiltXPos, tiltYRow, 5, 40);
    rect(450, tiltYRow+tiltYPos, 40, 5);//
    drawGraphicLabel(`TILT X : ${round(tiltX)}`, 220, tiltYRow + 35);
    drawGraphicLabel(`TILT Y : ${round(tiltY)}`, 450, tiltYRow + 165);
    pop();

  }

  function drawGraphicLabel(label, x, y) {
    fill(0);
    textSize(13);
    textStyle(NORMAL);
    text(label, x, y);
  }

  function numberValue(value, fallback) {
    const parsed = Number.parseFloat(value);
    return Number.isFinite(parsed) ? parsed : fallback;
  }

  function windowResized() {
    resizeCanvas(windowWidth, 600);
  }

  function show(data) {
    document.querySelector('#button1').textContent = data.button1 ? 'ON' : 'OFF';
    document.querySelector('#button2').textContent = data.button2 ? 'ON' : 'OFF';
    document.querySelector('#analog1').textContent = data.analog1;
    document.querySelector('#analog2').textContent = data.analog2;
    document.querySelector('#analog3').textContent = data.analog3;
    document.querySelector('#vlActive').textContent = data.vlActive ? 'ACTIVE' : 'INACTIVE';
    document.querySelector('#distanceMm').textContent = data.vlActive ? `${data.distanceMm} mm` : 'N/A';
    document.querySelector('#tiltX').textContent = data.tiltX;
    document.querySelector('#tiltY').textContent = data.tiltY;
  }

  connectButton.addEventListener('click', async () => {
    if (!('serial' in navigator)) {
      statusText.textContent = 'This browser does not support Web Serial.';
      return;
    }

    try {
      port = await navigator.serial.requestPort();
      await port.open({ baudRate: 38400 });
      keepReading = true;
      connectButton.disabled = true;
      connectButton.textContent = 'CONNECTED';
      statusText.textContent = 'Connected';
      await readSerial();
    } catch (error) {
      statusText.textContent = `Connection Error: ${error.message}`;
      connectButton.disabled = false;
    }
  });

  async function readSerial() {
    const decoder = new TextDecoder();
    let buffer = '';

    while (port?.readable && keepReading) {
      const reader = port.readable.getReader();
      try {
        while (keepReading) {
          const { value, done } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split(/\r?\n/);
          buffer = lines.pop();

          for (const line of lines) {
            try {
              sensorData = { ...sensorData, ...JSON.parse(line) };
              show(sensorData);
            } catch {
              // Ignore Arduino startup messages and incomplete non-JSON lines.
            }
          }
        }
      } catch (error) {
        statusText.textContent = `Receive Error: ${error.message}`;
        keepReading = false;
        connectButton.disabled = false;
        connectButton.textContent = 'CONNECT';
      } finally {
        reader.releaseLock();
      }
    }
  }
</script>
</body>
</html>
